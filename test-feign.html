<!DOCTYPE html>
<html>
<head>
    <title>Feign接口测试</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            line-height: 1.6;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
        }
        .card {
            border: 1px solid #ddd;
            border-radius: 4px;
            padding: 15px;
            margin-bottom: 20px;
        }
        h2 {
            color: #333;
            margin-top: 0;
        }
        button {
            background-color: #4CAF50;
            color: white;
            padding: 10px 15px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            margin-right: 10px;
            margin-top: 10px;
        }
        button:hover {
            background-color: #45a049;
        }
        input[type=text], input[type=number] {
            width: 100%;
            padding: 10px;
            margin: 8px 0;
            display: inline-block;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }
        pre {
            background-color: #f5f5f5;
            padding: 10px;
            border-radius: 4px;
            overflow-x: auto;
        }
        .button-group {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        .warning {
            background-color: #fff3cd;
            color: #856404;
            padding: 10px;
            border-radius: 4px;
            margin-bottom: 15px;
        }
        .success {
            background-color: #d4edda;
            color: #155724;
            padding: 10px;
            border-radius: 4px;
            margin-bottom: 15px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Feign客户端接口测试</h1>
        
        <div class="warning">
            <strong>注意:</strong> 远程服务可能不可用，这是预期的测试场景。请使用本地服务测试按钮来测试降级功能。
        </div>
        
        <div class="card">
            <h2>健康检查</h2>
            <button onclick="checkHealth()">检查健康状态</button>
            <pre id="healthResult">结果将显示在这里...</pre>
        </div>
        
        <div class="card">
            <h2>测试降级功能</h2>
            <div>
                <label for="userId">用户ID:</label>
                <input type="number" id="userId" placeholder="输入用户ID" value="1">
            </div>
            <div class="button-group">
                <button onclick="testFallback()">测试远程服务(可能失败)</button>
                <button onclick="testLocalFallback()">测试本地服务</button>
            </div>
            <pre id="fallbackResult">结果将显示在这里...</pre>
        </div>
        
        <div class="card">
            <h2>创建用户</h2>
            <div>
                <label for="username">用户名:</label>
                <input type="text" id="username" placeholder="输入用户名">
            </div>
            <div>
                <label for="email">邮箱:</label>
                <input type="text" id="email" placeholder="输入邮箱">
            </div>
            <button onclick="createUser()">创建用户(本地)</button>
            <pre id="createResult">结果将显示在这里...</pre>
        </div>
        
        <div class="card">
            <h2>检查Feign状态</h2>
            <div class="button-group">
                <button onclick="checkFeignStatus()">检查远程服务状态</button>
                <button onclick="checkLocalFeignStatus()">检查本地服务状态</button>
            </div>
            <pre id="statusResult">结果将显示在这里...</pre>
        </div>
        
        <div class="card">
            <h2>特殊测试场景</h2>
            <div class="button-group">
                <button onclick="testSpecialId(0)">测试服务错误 (ID=0)</button>
                <button onclick="testSpecialId(999)">测试服务超时 (ID=999)</button>
                <button onclick="testSpecialId(100)">测试用户不存在 (ID=100)</button>
            </div>
            <pre id="specialResult">结果将显示在这里...</pre>
        </div>
    </div>

    <script>
        // 健康检查
        function checkHealth() {
            const resultElement = document.getElementById('healthResult');
            resultElement.textContent = '请求中...';
            
            fetch('/api/feign-test/health')
                .then(response => response.json())
                .then(data => {
                    resultElement.textContent = JSON.stringify(data, null, 2);
                })
                .catch(error => {
                    resultElement.textContent = '错误: ' + error.message;
                });
        }
        
        // 测试降级功能 - 远程服务
        function testFallback() {
            const userId = document.getElementById('userId').value;
            const resultElement = document.getElementById('fallbackResult');
            resultElement.textContent = '请求中...';
            
            fetch(`/api/feign-test/test-fallback/${userId}`)
                .then(response => response.json())
                .then(data => {
                    resultElement.textContent = JSON.stringify(data, null, 2);
                })
                .catch(error => {
                    resultElement.textContent = '错误: ' + error.message;
                });
        }
        
        // 测试降级功能 - 本地服务
        function testLocalFallback() {
            const userId = document.getElementById('userId').value;
            const resultElement = document.getElementById('fallbackResult');
            resultElement.textContent = '请求中...';
            
            // 强制使用本地服务
            fetch(`/api/users/${userId}`)
                .then(response => response.json())
                .then(data => {
                    const result = {
                        success: true,
                        user: data,
                        clientType: 'direct-local',
                        fallbackTriggered: false
                    };
                    resultElement.textContent = JSON.stringify(result, null, 2);
                })
                .catch(error => {
                    resultElement.textContent = '错误: ' + error.message;
                });
        }
        
        // 创建用户
        function createUser() {
            const username = document.getElementById('username').value;
            const email = document.getElementById('email').value;
            const resultElement = document.getElementById('createResult');
            resultElement.textContent = '请求中...';
            
            const userData = {
                username: username,
                email: email
            };
            
            fetch('/api/feign-test/test-create', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify(userData)
            })
            .then(response => response.json())
            .then(data => {
                resultElement.textContent = JSON.stringify(data, null, 2);
            })
            .catch(error => {
                resultElement.textContent = '错误: ' + error.message;
            });
        }
        
        // 检查远程Feign状态
        function checkFeignStatus() {
            const resultElement = document.getElementById('statusResult');
            resultElement.textContent = '请求中...';
            
            fetch('/api/feign-demo/status')
                .then(response => response.json())
                .then(data => {
                    resultElement.textContent = JSON.stringify(data, null, 2);
                })
                .catch(error => {
                    resultElement.textContent = '错误: ' + error.message;
                });
        }
        
        // 检查本地Feign状态
        function checkLocalFeignStatus() {
            const resultElement = document.getElementById('statusResult');
            resultElement.textContent = '请求中...';
            
            fetch('/api/feign-test/local-status')
                .then(response => response.json())
                .then(data => {
                    resultElement.textContent = JSON.stringify(data, null, 2);
                })
                .catch(error => {
                    resultElement.textContent = '错误: ' + error.message;
                });
        }
        
        // 测试特殊ID场景
        function testSpecialId(id) {
            const resultElement = document.getElementById('specialResult');
            resultElement.textContent = '请求中...';
            
            fetch(`/api/users/${id}`)
                .then(response => {
                    if (!response.ok) {
                        return response.json().then(err => {
                            throw new Error(JSON.stringify(err));
                        });
                    }
                    return response.json();
                })
                .then(data => {
                    const result = {
                        success: true,
                        response: data,
                        testId: id,
                        testDescription: getTestDescription(id)
                    };
                    resultElement.textContent = JSON.stringify(result, null, 2);
                })
                .catch(error => {
                    const result = {
                        success: false,
                        error: error.message,
                        testId: id,
                        testDescription: getTestDescription(id)
                    };
                    resultElement.textContent = JSON.stringify(result, null, 2);
                });
        }
        
        // 获取测试描述
        function getTestDescription(id) {
            switch(parseInt(id)) {
                case 0:
                    return "测试服务错误场景 - 预期返回500错误";
                case 999:
                    return "测试服务超时场景 - 预期等待5秒";
                case 100:
                    return "测试用户不存在场景 - 预期返回404错误";
                default:
                    return "常规测试";
            }
        }
    </script>
</body>
</html>
