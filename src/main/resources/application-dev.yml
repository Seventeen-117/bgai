spring:
  webflux:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
      max-in-memory-size: 512KB
  main:
    web-application-type: reactive
    allow-circular-references: true # 允许循环依赖，因为项目是三层架构，无法避免这个情况。
    allow-bean-definition-overriding: true # 允许 Bean 覆盖，例如说 Feign 等会存在重复定义的服务
  application:
    name: bgtech-ai
  config:
    import:
      - optional:classpath:deepseek-config.properties
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_HOST:8.133.246.113}:${NACOS_PORT:8848}
        namespace: ${NACOS_NAMESPACE:d750d92e-152f-4055-a641-3bc9dda85a29}
        group: ${NACOS_GROUP:DEFAULT_GROUP}
        # 使配置失败时更友好的处理，不会导致应用启动失败
        fail-fast: false
      config:
        server-addr: ${spring.cloud.nacos.discovery.server-addr}
        namespace: ${spring.cloud.nacos.discovery.namespace}
        group: ${spring.cloud.nacos.discovery.group}
        file-extension: yaml
        # 警告处理配置
        handle-warnings: true
        # 使配置失败时更友好的处理，不会导致应用启动失败
        fail-fast: false
        # 设置超时时间，防止长时间等待
        timeout: 5000
        refresh-enabled: true
        # 使用默认缓存目录，确保容器能正确访问
        shared-configs:
          - data-id: common-${spring.profiles.active}.${spring.cloud.nacos.config.file-extension}
            group: ${spring.cloud.nacos.discovery.group}
            refresh: true
    # LoadBalancer 配置
    loadbalancer:
      ribbon:
        enabled: false # 禁用Ribbon，使用Spring Cloud LoadBalancer
      cache:
        enabled: true
        caffeine:
          spec: expireAfterWrite=5s
      service-discovery:
        timeout: 5000
        fail-fast: false
    openfeign:
      okhttp:
        enabled: true
      httpclient:
        enabled: false
      client:
        config:
          default:
            connectTimeout: 5000
            readTimeout: 10000
            loggerLevel: full
          user-service:  # 为user-service服务指定配置
            url: ${bgai.feign.user-service.url}  # 使用配置参数
          local-user-service:
            url: ${bgai.feign.local-user-service.url}  # 使用配置参数
      compression:
        request:
          enabled: true
        response:
          enabled: true
      circuitbreaker:
        enabled: true
        # 确保Feign正确处理降级
        group:
          enabled: true
    # Spring Cloud Gateway配置
    gateway:
      httpclient:
        connect-timeout: 5000
        response-timeout: 30000
        pool:
          max-connections: 200
      discovery:
        locator:
          enabled: true # 开启从注册中心动态创建路由
          lower-case-service-id: true # 使用小写服务ID
      # 默认路由超时配置
      default-filters:
        - name: RequestRateLimiter
          args:
            redis-rate-limiter.replenishRate: 10
            redis-rate-limiter.burstCapacity: 20
            key-resolver: "#{@ipKeyResolver}"
        - name: Retry
          args:
            retries: 3
            statuses: BAD_GATEWAY,SERVICE_UNAVAILABLE
            methods: GET,POST

# SpringDoc配置
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
    display-request-duration: true
  api-docs:
    path: /v3/api-docs
    enabled: true
  show-actuator: false
  default-consumes-media-type: application/json
  default-produces-media-type: application/json
  paths-to-match:
    - /api/**
    
# 自定义配置
bgai:
  feign:
    enabled: false # 禁用所有Feign客户端，避免与网关冲突
    user-service:
      url: http://localhost:8688 # Feign客户端调用URL
    local-user-service:
      url: http://localhost:8688 # 本地用户服务URL
    demo:
      enabled: false # 禁用Feign示例控制器，避免与网关冲突
    test:
      enabled: false # 禁用Feign测试控制器，避免与网关冲突
    config:
      enabled: true # 启用Feign配置
  gateway:
    enabled: true # 启用Gateway功能

# 禁用Actuator Metrics
management:
  simple:
    metrics:
      export:
        enabled: false
  metrics:
    enable:
      all: false
