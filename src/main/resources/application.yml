server:
  port: 8688
# Additional server configuration
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text/xml,text/plain
    min-response-size: 2048
  http2:
    enabled: true
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

# 禁用Actuator Metrics，避免应用关闭时的bean创建错误
management:
  metrics:
    enable:
      all: false
  simple:
    metrics:
      export:
        enabled: false
  endpoints:
    web:
      exposure:
        include: health,info