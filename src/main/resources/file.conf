transport {
  # tcp, unix-domain-socket
  type = "TCP"
  # NIO, NATIVE
  server = "NIO"
  # enable heartbeat
  heartbeat = true
  # enable client batch send request
  enable-client-batch-send-request = true
  # thread factory for netty
  thread-factory {
    boss-thread-prefix = "NettyBoss"
    worker-thread-prefix = "NettyServerNIOWorker"
    server-executor-thread-prefix = "NettyServerBizHandler"
    share-boss-worker = false
    client-selector-thread-prefix = "NettyClientSelector"
    client-selector-thread-size = 1
    client-worker-thread-prefix = "NettyClientWorkerThread"
    # netty boss thread size
    boss-thread-size = 1
    # auto default pin or 8
    worker-thread-size = 8
  }
  shutdown {
    # when destroy server, wait seconds
    wait = 3
  }
  # serialize
  serialization = "seata"
  # compressor
  compressor = "none"
}

service {
  # Transaction group mapping
  vgroupMapping.default-tx-group = "default"
  # only support when registry.type=file, please don't set multiple addresses
  default.grouplist = "8.133.246.113:8091"
  # degrade, current not support
  enableDegrade = false
  # disable seata
  disableGlobalTransaction = false
  max.commit.retry.timeout = "-1"
  max.rollback.retry.timeout = "-1"
}

client {
  # RM配置
  rm {
    async.commit.buffer.limit = 10000
    report.retry.count = 5
    table.meta.check.enable = false
    report.success.enable = true
    sagaBranchRegisterEnable = true
    sagaJsonParser = "fastjson"
    sagaRetryPersistModeUpdate = false
    sagaCompensatePersistModeUpdate = false
  }
  # TM配置
  tm {
    commit.retry.count = 5
    rollback.retry.count = 5
  }
  # AT模式锁配置
  lock {
    retry.internal = 10
    retry.times = 30
    retry.policy.branch-rollback-on-conflict = true
  }
  undo {
    data.validation = true
    log.serialization = "jackson"
    log.table = "undo_log"
    only.care.update.columns = true
  }
  log {
    exceptionRate = 100
  }
}

# 安全认证配置
security {
  # 是否开启安全验证
  auth-enabled = false
  # 安全验证类型
  auth-type = "file"
  # 访问密钥，可选
  access-key = ""
  # 安全密钥，可选
  secret-key = ""
}

# Saga状态机配置
saga {
  enabled = true
  state-machine {
    application-id = "bgai-application"
    transaction-name = "saga_transaction"
    parallel-task-timeout = 60000
    # 状态机定义存储方式
    repository-type = "file"
    # 状态机定义文件路径
    resources = "classpath:statelang/*"
  }
}

store {
  mode = "db"
  db {
    datasource = "druid"
    db-type = "mysql"
    driver-class-name = "com.mysql.cj.jdbc.Driver"
    url = "jdbc:mysql://8.133.246.113:3306/deepseek?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai"
    user = "bgtech"
    password = "Zly689258.."
    min-conn = 5
    max-conn = 30
    global.table = "global_table"
    branch.table = "branch_table"
    lock-table = "lock_table"
    query-limit = 100
    max-wait = 5000
  }
} 