# API密钥控制器测试数据
description: "API密钥控制器API测试用例"
baseUrl: "/api/keys"
testCases:
  - id: "create-api-key-success"
    description: "创建API密钥成功"
    endpoint: ""
    request:
      method: "POST"
      headers:
        Content-Type: "application/json"
        Authorization: "Bearer ${token}"
      body:
        userId: "1001"
        name: "测试API密钥"
        expiresIn: 30
    expectedResponse:
      statusCode: 201
      bodyContains:
        - "apiKey"
        - "name"
        - "expiresAt"
      bodyEquals:
        success: true
        
  - id: "get-api-keys-by-user-success"
    description: "获取用户的API密钥列表成功"
    endpoint: "/user/{userId}"
    request:
      method: "GET"
      pathVariables:
        userId: "1001"
      headers:
        Authorization: "Bearer ${token}"
    expectedResponse:
      statusCode: 200
      bodyContains:
        - "["
        - "]"
        - "apiKeyId"
        - "name"
      
  - id: "get-api-key-by-id-success"
    description: "根据ID获取API密钥成功"
    endpoint: "/{apiKeyId}"
    request:
      method: "GET"
      pathVariables:
        apiKeyId: "api-key-001"
      headers:
        Authorization: "Bearer ${token}"
    expectedResponse:
      statusCode: 200
      bodyContains:
        - "apiKeyId"
        - "name"
        - "userId"
        - "createdAt"
        - "expiresAt"
      
  - id: "get-api-key-by-id-not-found"
    description: "根据ID获取API密钥失败 - 未找到"
    endpoint: "/{apiKeyId}"
    request:
      method: "GET"
      pathVariables:
        apiKeyId: "non-existent-key"
      headers:
        Authorization: "Bearer ${token}"
    expectedResponse:
      statusCode: 404
      bodyContains:
        - "API key not found"
      bodyEquals:
        success: false
        
  - id: "update-api-key-success"
    description: "更新API密钥成功"
    endpoint: "/{apiKeyId}"
    request:
      method: "PUT"
      pathVariables:
        apiKeyId: "api-key-001"
      headers:
        Content-Type: "application/json"
        Authorization: "Bearer ${token}"
      body:
        name: "更新的API密钥名称"
        expiresAt: "2025-12-31T23:59:59Z"
    expectedResponse:
      statusCode: 200
      bodyContains:
        - "apiKeyId"
        - "name"
        - "更新的API密钥名称"
      bodyEquals:
        success: true
        
  - id: "revoke-api-key-success"
    description: "撤销API密钥成功"
    endpoint: "/{apiKeyId}/revoke"
    request:
      method: "POST"
      pathVariables:
        apiKeyId: "api-key-001"
      headers:
        Authorization: "Bearer ${token}"
    expectedResponse:
      statusCode: 200
      bodyEquals:
        success: true
        
  - id: "delete-api-key-success"
    description: "删除API密钥成功"
    endpoint: "/{apiKeyId}"
    request:
      method: "DELETE"
      pathVariables:
        apiKeyId: "api-key-001"
      headers:
        Authorization: "Bearer ${token}"
    expectedResponse:
      statusCode: 204 