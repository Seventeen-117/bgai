# 反应式聊天控制器测试数据
description: "反应式聊天控制器API测试用例"
baseUrl: "/api/chat"
testCases:
  - id: "chat-completion-success"
    description: "聊天完成请求成功"
    endpoint: "/completions"
    request:
      method: "POST"
      headers:
        Content-Type: "application/json"
        Authorization: "Bearer ${token}"
      body:
        model: "gpt-3.5-turbo"
        messages:
          - role: "user"
            content: "Hello, how are you?"
        temperature: 0.7
        max_tokens: 100
    expectedResponse:
      statusCode: 200
      bodyContains:
        - "id"
        - "choices"
        - "content"
        - "usage"
      bodyEquals:
        success: true
        
  - id: "chat-completion-with-history-success"
    description: "带历史记录的聊天完成请求成功"
    endpoint: "/completions"
    request:
      method: "POST"
      headers:
        Content-Type: "application/json"
        Authorization: "Bearer ${token}"
      body:
        model: "gpt-3.5-turbo"
        messages:
          - role: "user"
            content: "Hello, how are you?"
          - role: "assistant"
            content: "I'm doing well, thank you for asking. How can I help you today?"
          - role: "user"
            content: "Tell me about yourself."
        temperature: 0.7
        max_tokens: 100
    expectedResponse:
      statusCode: 200
      bodyContains:
        - "id"
        - "choices"
        - "content"
        - "usage"
      bodyEquals:
        success: true
        
  - id: "chat-completion-invalid-model"
    description: "使用无效模型名称"
    endpoint: "/completions"
    request:
      method: "POST"
      headers:
        Content-Type: "application/json"
        Authorization: "Bearer ${token}"
      body:
        model: "invalid-model"
        messages:
          - role: "user"
            content: "Hello, how are you?"
        temperature: 0.7
        max_tokens: 100
    expectedResponse:
      statusCode: 400
      bodyContains:
        - "Invalid model"
      bodyEquals:
        success: false
        
  - id: "chat-completion-missing-messages"
    description: "缺少消息内容"
    endpoint: "/completions"
    request:
      method: "POST"
      headers:
        Content-Type: "application/json"
        Authorization: "Bearer ${token}"
      body:
        model: "gpt-3.5-turbo"
        temperature: 0.7
        max_tokens: 100
    expectedResponse:
      statusCode: 400
      bodyContains:
        - "Messages are required"
      bodyEquals:
        success: false
        
  - id: "chat-completion-unauthorized"
    description: "未授权访问"
    endpoint: "/completions"
    request:
      method: "POST"
      headers:
        Content-Type: "application/json"
      body:
        model: "gpt-3.5-turbo"
        messages:
          - role: "user"
            content: "Hello, how are you?"
        temperature: 0.7
        max_tokens: 100
    expectedResponse:
      statusCode: 401
      bodyContains:
        - "Unauthorized"
      bodyEquals:
        success: false
        
  - id: "chat-stream-success"
    description: "流式聊天请求成功"
    endpoint: "/stream"
    request:
      method: "POST"
      headers:
        Content-Type: "application/json"
        Authorization: "Bearer ${token}"
      body:
        model: "gpt-3.5-turbo"
        messages:
          - role: "user"
            content: "Hello, how are you?"
        temperature: 0.7
        max_tokens: 100
        stream: true
    expectedResponse:
      statusCode: 200
      bodyContains:
        - "data:"
        - "id"
        - "choices"
      
  - id: "chat-with-file-upload-success"
    description: "带文件上传的聊天请求成功"
    endpoint: "/with-file"
    request:
      method: "POST"
      headers:
        Authorization: "Bearer ${token}"
      multipart:
        file: "test-document.txt"
        contentType: "text/plain"
        fileContent: "This is a test document content for analysis."
        question: "Summarize this document."
        modelName: "gpt-3.5-turbo"
    expectedResponse:
      statusCode: 200
      bodyContains:
        - "id"
        - "choices"
        - "content"
        - "usage"
      bodyEquals:
        success: true 