# 动态路由控制器测试数据
description: "动态路由控制器API测试用例"
baseUrl: "/gateway/routes"
testCases:
  - id: "get-all-routes-success"
    description: "获取所有路由成功"
    endpoint: ""
    request:
      method: "GET"
    expectedResponse:
      statusCode: 200
      bodyContains:
        - "["
        - "]"

  - id: "get-route-by-id-success"
    description: "根据ID获取路由成功"
    endpoint: "/route-001"
    request:
      method: "GET"
    expectedResponse:
      statusCode: 200
      bodyContains:
        - "id"
        - "uri"
        - "predicates"
        - "filters"

  - id: "get-route-by-id-not-found"
    description: "根据ID获取路由失败 - 未找到"
    endpoint: "/non-existent-route"
    request:
      method: "GET"
    expectedResponse:
      statusCode: 404

  - id: "create-route-success"
    description: "创建路由成功"
    endpoint: ""
    request:
      method: "POST"
      headers:
        Content-Type: "application/json"
      body:
        id: "new-test-route"
        uri: "http://example.com"
        predicates:
          - name: "Path"
            args:
              pattern: "/test/**"
        filters:
          - name: "StripPrefix"
            args:
              parts: 1
    expectedResponse:
      statusCode: 201

  - id: "update-route-success"
    description: "更新路由成功"
    endpoint: ""
    request:
      method: "PUT"
      headers:
        Content-Type: "application/json"
      body:
        id: "route-001"
        uri: "http://updated-example.com"
        predicates:
          - name: "Path"
            args:
              pattern: "/updated/**"
    expectedResponse:
      statusCode: 200

  - id: "delete-route-success"
    description: "删除路由成功"
    endpoint: "/route-001"
    request:
      method: "DELETE"
    expectedResponse:
      statusCode: 200

  - id: "refresh-routes-success"
    description: "刷新所有路由成功"
    endpoint: "/refresh"
    request:
      method: "POST"
    expectedResponse:
      statusCode: 200

  - id: "batch-add-routes-success"
    description: "批量添加路由成功"
    endpoint: "/batch"
    request:
      method: "POST"
      headers:
        Content-Type: "application/json"
      body:
        - id: "route-002"
          uri: "http://example2.com"
          predicates:
            - name: "Path"
              args:
                pattern: "/test2/**"
        - id: "route-003"
          uri: "http://example3.com"
          predicates:
            - name: "Path"
              args:
                pattern: "/test3/**"
    expectedResponse:
      statusCode: 201

  - id: "batch-delete-routes-success"
    description: "批量删除路由成功"
    endpoint: "/batch"
    request:
      method: "DELETE"
      headers:
        Content-Type: "application/json"
      body:
        - "route-002"
        - "route-003"
    expectedResponse:
      statusCode: 200 