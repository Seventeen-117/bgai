# 认证控制器API测试数据
description: "认证控制器API测试用例"
baseUrl: "/api/auth"
testCases:
  - id: "login-success"
    description: "用户登录成功"
    endpoint: "/login"
    request:
      method: "POST"
      headers:
        Content-Type: "application/json"
      body:
        username: "admin"
        password: "admin123"
    expectedResponse:
      statusCode: 200
      bodyContains:
        - "token"
        - "userId"
      bodyEquals:
        success: true
        
  - id: "login-invalid-credentials"
    description: "用户登录失败 - 无效凭据"
    endpoint: "/login"
    request:
      method: "POST"
      headers:
        Content-Type: "application/json"
      body:
        username: "admin"
        password: "wrongpassword"
    expectedResponse:
      statusCode: 401
      bodyContains:
        - "Invalid credentials"
      bodyEquals:
        success: false
        
  - id: "refresh-token-success"
    description: "刷新令牌成功"
    endpoint: "/refresh"
    request:
      method: "POST"
      headers:
        Content-Type: "application/json"
        Authorization: "Bearer ${token}"
      body:
        userId: "1001"
        refreshToken: "${refreshToken}"
    expectedResponse:
      statusCode: 200
      bodyContains:
        - "token"
        - "refreshToken"
      bodyEquals:
        success: true
        
  - id: "refresh-token-invalid"
    description: "刷新令牌失败 - 无效令牌"
    endpoint: "/refresh"
    request:
      method: "POST"
      headers:
        Content-Type: "application/json"
      body:
        userId: "1001"
        refreshToken: "invalid-refresh-token"
    expectedResponse:
      statusCode: 401
      bodyContains:
        - "Invalid refresh token"
      bodyEquals:
        success: false
        
  - id: "validate-token-success"
    description: "验证令牌成功"
    endpoint: "/validate"
    request:
      method: "POST"
      headers:
        Content-Type: "application/json"
        Authorization: "Bearer ${token}"
    expectedResponse:
      statusCode: 200
      bodyEquals:
        valid: true
        
  - id: "validate-token-invalid"
    description: "验证令牌失败 - 无效令牌"
    endpoint: "/validate"
    request:
      method: "POST"
      headers:
        Content-Type: "application/json"
        Authorization: "Bearer invalid-token"
    expectedResponse:
      statusCode: 401
      bodyEquals:
        valid: false
        
  - id: "logout-success"
    description: "用户登出成功"
    endpoint: "/logout"
    request:
      method: "POST"
      headers:
        Content-Type: "application/json"
        Authorization: "Bearer ${token}"
      body:
        userId: "1001"
    expectedResponse:
      statusCode: 200
      bodyEquals:
        success: true 